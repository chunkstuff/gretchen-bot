name: Deploy Gretchen to PiLab

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Deploy to Pi via Cloudflare Tunnel
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.PI_HOST }}
        username: ${{ secrets.PI_USERNAME }}
        key: ${{ secrets.PI_SSH_KEY }}
        script: |
          echo "🚀 Starting deployment of Gretchen..."
          
          DEPLOY_DIR="/tmp/gretchen-deploy-$(date +%s)"
          mkdir -p $DEPLOY_DIR
          cd $DEPLOY_DIR
          
          echo "📥 Cloning repository..."
          git clone https://github.com/${{ github.repository }}.git .
          
          sudo mkdir -p /home/pluribus/plures/gretchen
          
          echo "🛑 Stopping bot..."
          sudo systemctl stop gretchen.service 2>/dev/null || true
          
          if [ -d "/home/pluribus/plures/gretchen" ]; then
            sudo cp -r /home/pluribus/plures/gretchen /home/pluribus/plures/gretchen.backup
          fi
          
          echo "📋 Deploying code..."
          sudo rsync -av --delete \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='.env.example' \
            --exclude='*.log' \
            --exclude='README.md' \
            --exclude='venv' \
            $DEPLOY_DIR/ \
            /home/pluribus/plures/gretchen/
          
          if [ -f "/home/pluribus/plures/gretchen.backup/.env" ]; then
            sudo cp /home/pluribus/plures/gretchen.backup/.env /home/pluribus/plures/gretchen/.env
          fi
          
          sudo chown -R pluribus:pluribus /home/pluribus/plures/gretchen/
          
          echo "📦 Setting up virtual environment..."
          if [ ! -d "/home/pluribus/plures/gretchen/venv" ]; then
            sudo -u pluribus python3 -m venv /home/pluribus/plures/gretchen/venv
          fi
          
          sudo -u pluribus /home/pluribus/plures/gretchen/venv/bin/pip install --upgrade pip
          sudo -u pluribus /home/pluribus/plures/gretchen/venv/bin/pip install -r /home/pluribus/plures/gretchen/requirements.txt
          
          echo "▶️  Starting bot..."
          sudo systemctl start gretchen.service
          
          sleep 3
          if sudo systemctl is-active --quiet gretchen.service; then
            echo "✅ Gretchen deployed successfully!"
            sudo journalctl -u gretchen.service -n 10 --no-pager
          else
            echo "❌ Deployment failed! Rolling back..."
            sudo systemctl stop gretchen.service
            sudo rm -rf /home/pluribus/plures/gretchen
            if [ -d "/home/pluribus/plures/gretchen.backup" ]; then
              sudo mv /home/pluribus/plures/gretchen.backup /home/pluribus/plures/gretchen
              sudo systemctl start gretchen.service
            fi
            exit 1
          fi
          
          rm -rf $DEPLOY_DIR
          sudo rm -rf /home/pluribus/plures/gretchen.backup
          
          echo "🎉 Deployment complete!"
